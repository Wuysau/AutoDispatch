[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aethertrade-autodispatch"
version = "0.1.0"
description = "Bounded, evidence-driven AetherTrade task dispatcher"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
host = ["pywebview>=6"]

[project.scripts]
autodispatch = "autodispatch.cli:main"

[tool.setuptools.packages.find]
include = ["autodispatch*"]
